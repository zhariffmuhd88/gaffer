<style>
/* Layout: sticky top bar + left nav rail + dense data panel, teletext broadcast palette (single committed dark look) */
:root {
  --ink: #090d26;
  --panel: #10183f;
  --panel2: #162052;
  --row: #131c48;
  --rowalt: #0f1640;
  --line: #27357a;
  --band: #1b36c2;
  --band2: #12258a;
  --text: #edf0ff;
  --dim: #98a3d6;
  --yel: #ffd23f;
  --cyan: #45e1f0;
  --grn: #52e08c;
  --red: #ff5f5f;
  --mag: #ff73d8;
  --amb: #ffa73d;
  --bandtx: #ffffff;
  --acctx: #111111;
  --f-disp: 'VT323', 'Courier New', monospace;
  --f-body: 'IBM Plex Sans Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--f-body); font-size: 14px; line-height: 1.35; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--band2); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--yel); outline-offset: 1px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.yel { color: var(--yel); } .cyan { color: var(--cyan); } .grn { color: var(--grn); } .red { color: var(--red); } .amb { color: var(--amb); } .mag { color: var(--mag); }
a { color: var(--cyan); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--band2); border-bottom: 3px solid var(--yel); padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-disp); font-size: 30px; line-height: 1; color: var(--yel); letter-spacing: 1px; white-space: nowrap; }
.logo span { color: var(--cyan); }
.club-chip { display: flex; align-items: center; gap: 8px; min-width: 0; }
.club-chip b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-block; width: 14px; height: 18px; border: 1px solid rgba(255,255,255,.35); flex: none; vertical-align: -3px; }
.top .date { font-family: var(--f-disp); font-size: 22px; color: var(--cyan); white-space: nowrap; }
.top .next { color: var(--dim); font-size: 13px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.go { background: var(--yel); color: var(--acctx); border: 0; font-family: var(--f-disp); font-size: 24px; padding: 4px 18px; line-height: 1.1; letter-spacing: 1px; box-shadow: 3px 3px 0 #000; }
.go:hover { filter: brightness(1.08); }
.go:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.go:disabled { opacity: .5; cursor: default; }

/* frame */
.frame { display: grid; grid-template-columns: 170px minmax(0, 1fr); min-height: calc(100% - 52px); }
.nav { background: var(--panel); border-right: 1px solid var(--line); padding-block: 8px; display: flex; flex-direction: column; gap: 2px; }
.nav button { text-align: left; background: none; border: 0; border-left: 4px solid transparent; padding: 7px 12px; color: var(--dim); font-size: 15px; font-weight: 600; letter-spacing: .3px; display: flex; justify-content: space-between; align-items: center; }
.nav button:hover { color: var(--text); background: var(--row); }
.nav button.on { color: var(--yel); border-left-color: var(--yel); background: var(--row); }
.nav .cnt { background: var(--red); color: #fff; font-size: 11px; padding: 0 5px; font-family: var(--f-mono); }
.main { min-width: 0; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 760px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .nav { flex-direction: row; overflow-x: auto; padding: 0; border-right: 0; border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 46px); z-index: 30; }
  .nav button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; padding: 9px 12px; }
  .nav button.on { border-bottom-color: var(--yel); }
  .top .next { display: none; }
  .logo { font-size: 24px; }
}

/* headings & bands */
.band { background: var(--band); color: var(--bandtx); font-family: var(--f-disp); font-size: 24px; line-height: 1; padding: 6px 10px 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.band small { font-family: var(--f-body); font-size: 13px; color: var(--bandtx); opacity: .8; }
.band.yel { background: var(--yel); color: var(--acctx); }
.band.yel small { color: var(--acctx); }
h2.sect { font-family: var(--f-disp); font-weight: 400; font-size: 22px; color: var(--yel); margin: 18px 0 6px; letter-spacing: .5px; }
.box { background: var(--panel); border: 1px solid var(--line); }
.pad { padding: 10px 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.t th { background: var(--band2); color: var(--cyan); font-weight: 600; text-align: left; padding: 5px 7px; white-space: nowrap; position: sticky; top: 0; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; }
.t th.s { cursor: pointer; }
.t th.s:hover { color: var(--yel); }
.t td { padding: 4px 7px; border-top: 1px solid #1b2660; white-space: nowrap; }
.t tr:nth-child(even) td { background: var(--rowalt); }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: #1d2a6e; }
.t tr.me td { background: #2a2a10 !important; color: var(--yel); }
.t td.n, .t th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.t td.c, .t th.c { text-align: center; }
.zone-ucl { box-shadow: inset 4px 0 0 var(--cyan); }
.zone-uel { box-shadow: inset 4px 0 0 var(--amb); }
.zone-uecl { box-shadow: inset 4px 0 0 var(--grn); }
.zone-rel { box-shadow: inset 4px 0 0 var(--red); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 4px; line-height: 16px; letter-spacing: .4px; }
.tag.inj { background: var(--red); color: #fff; }
.tag.sus { background: var(--mag); color: #111; }
.tag.lst { background: var(--amb); color: #111; }
.tag.new { background: var(--grn); color: #111; }
.tag.out { background: #444b78; color: #fff; }
.form span { display: inline-block; width: 16px; text-align: center; font-family: var(--f-mono); font-size: 11px; font-weight: 600; margin-right: 1px; color: #111; }
.form .W { background: var(--grn); } .form .D { background: #c8cbe0; } .form .L { background: var(--red); color: #fff; }
.bar { height: 8px; background: #0a1033; border: 1px solid var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--cyan); }

/* controls */
.btn { background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 5px 11px; font-weight: 600; }
.btn:hover { border-color: var(--cyan); color: var(--cyan); }
.btn.pri { background: var(--yel); color: var(--acctx); border-color: var(--yel); }
.btn.pri:hover { filter: brightness(1.08); color: var(--acctx); }
.btn.warn { border-color: var(--red); color: var(--red); }
.btn.on { background: var(--cyan); color: #111; border-color: var(--cyan); }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button { background: var(--panel); border: 0; border-right: 1px solid var(--line); padding: 4px 9px; color: var(--dim); font-weight: 600; font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--cyan); color: #111; }
input.f, select.f { background: #0a1033; border: 1px solid var(--line); padding: 5px 8px; min-width: 0; }
input.f:focus, select.f:focus { border-color: var(--cyan); outline: none; }
label.lb { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 3px; }
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--band); margin-bottom: 10px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 6px 12px; color: var(--dim); font-weight: 600; white-space: nowrap; }
.tabs button.on { background: var(--band); color: var(--bandtx); }

/* inbox */
.inbox { display: grid; grid-template-columns: minmax(220px, 340px) minmax(0, 1fr); gap: 12px; }
@media (max-width: 760px) { .inbox { grid-template-columns: minmax(0, 1fr); } }
.mlist { max-height: 70vh; overflow-y: auto; }
.mitem { padding: 7px 10px; border-bottom: 1px solid #1b2660; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.mitem:hover { background: var(--row); }
.mitem.on { background: #1d2a6e; }
.mitem b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mitem.unread b { color: var(--yel); }
.mitem .d { font-size: 12px; color: var(--dim); font-family: var(--f-mono); }
.mitem .x { grid-column: 1 / -1; font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mbody { padding: 14px 16px; font-size: 15px; line-height: 1.5; max-width: 70ch; }
.mbody h3 { font-family: var(--f-disp); font-weight: 400; font-size: 26px; color: var(--yel); margin: 0 0 4px; }

/* pitch */
.tact { display: grid; grid-template-columns: minmax(280px, 420px) minmax(0, 1fr); gap: 14px; }
@media (max-width: 900px) { .tact { grid-template-columns: minmax(0, 1fr); } }
.pitch { position: relative; aspect-ratio: 68 / 92; max-width: 100%; background: repeating-linear-gradient(0deg, #155a2c 0 9%, #186532 9% 18%); border: 2px solid #d9f5df; }
.pitch::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 15%; border: 2px solid rgba(255,255,255,.6); border-bottom: 0; }
.pitch::after { content: ""; position: absolute; left: 22%; right: 22%; top: 0; height: 15%; border: 2px solid rgba(255,255,255,.6); border-top: 0; }
.pitch .half { position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255,255,255,.6); }
.pitch .circ { position: absolute; left: 50%; top: 50%; width: 26%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; transform: translate(-50%, -50%); }
.slot { position: absolute; transform: translate(-50%, 50%); width: 23%; text-align: center; cursor: pointer; background: none; border: 0; padding: 0; }
.slot .sh { display: inline-grid; place-items: center; width: 30px; height: 30px; font-family: var(--f-mono); font-weight: 600; font-size: 13px; border: 2px solid #fff; box-shadow: 2px 2px 0 rgba(0,0,0,.5); }
.slot .nm { display: block; font-size: 11.5px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .rl { display: block; font-size: 10px; font-family: var(--f-mono); color: #d8ffe3; text-shadow: 0 1px 2px #000; }
.slot.sel .sh { outline: 3px solid var(--yel); outline-offset: 2px; }
.slot.f-bad .rl { color: #ff9b9b; } .slot.f-ok .rl { color: #ffd98a; }
.slot.empty .sh { background: #333 !important; border-style: dashed; }

/* match */
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; background: #050818; border: 2px solid var(--band); padding: 10px; }
.score .tm { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 22px; font-weight: 700; }
.score .tm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .tm.r { justify-content: flex-end; text-align: right; }
.score .tm .badge { width: 18px; height: 24px; }
.score .sc { font-family: var(--f-disp); font-size: 54px; line-height: .9; color: var(--yel); text-align: center; white-space: nowrap; }
.score .mn { font-family: var(--f-disp); font-size: 24px; color: var(--cyan); text-align: center; }
.score .sub { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--dim); }
.score .sub div { min-width: 0; }
.ticker { background: var(--yel); color: var(--acctx); font-weight: 600; padding: 7px 12px; font-size: 16px; min-height: 36px; border-left: 8px solid #000; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; margin-top: 12px; }
@media (max-width: 900px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.log { height: 430px; overflow-y: auto; background: #050818; border: 1px solid var(--line); font-size: 14px; }
.log div { padding: 4px 10px; border-bottom: 1px solid #10183f; display: grid; grid-template-columns: 34px 1fr; gap: 6px; }
.log .m { font-family: var(--f-mono); color: var(--dim); text-align: right; }
.log .goal { background: #3a3400; color: var(--yel); font-weight: 700; }
.log .yc span:last-child::before { content: "▮ "; color: var(--yel); }
.log .rc span:last-child::before { content: "▮ "; color: var(--red); }
.log .rc { color: #ffb3b3; }
.log .ht, .log .ft, .log .ko { background: var(--band2); color: var(--cyan); font-weight: 600; }
.log .inj { color: var(--amb); }
.log .sub { color: var(--grn); }
.log .save, .log .miss, .log .big, .log .pen { color: #d6dcff; }
.log .fl, .log .foul, .log .info { color: var(--dim); }
.stat { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; font-size: 13px; margin: 4px 0; }
.stat .v { font-family: var(--f-mono); text-align: center; }
.stat .lbl { text-align: center; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
.sbar { display: flex; height: 6px; grid-column: 1 / -1; margin-top: -2px; }
.sbar i { display: block; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.alert { background: var(--red); color: #fff; padding: 6px 12px; font-weight: 700; }

/* modal */
.ov { position: fixed; inset: 0; background: rgba(3,5,18,.78); z-index: 60; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) 24px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.modal { background: var(--panel); border: 2px solid var(--band); width: min(820px, 100%); box-shadow: 8px 8px 0 #000; }
.modal .mc { padding: 12px 14px; }
.x { background: none; border: 0; color: #fff; font-size: 22px; line-height: 1; padding: 0 4px; }
.attrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; }
.attr { display: flex; justify-content: space-between; border-bottom: 1px dotted #26346f; padding: 2px 0; font-size: 13.5px; }
.attr b { font-family: var(--f-mono); }
.a-hi { color: var(--grn); } .a-mid { color: var(--text); } .a-lo { color: var(--amb); } .a-vlo { color: var(--red); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; }
.big { font-family: var(--f-disp); font-size: 40px; line-height: 1; color: var(--yel); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--yel); color: var(--acctx); padding: 8px 16px; font-weight: 600; box-shadow: 4px 4px 0 #000; max-width: calc(100% - 32px); }

/* start screen */
.start { max-width: 1080px; margin: 0 auto; padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.title { font-family: var(--f-disp); font-size: clamp(36px, 13vw, 120px); line-height: .85; max-width: 100%; overflow-wrap: anywhere; color: var(--yel); letter-spacing: 2px; text-shadow: 5px 5px 0 var(--band); }
.title span { color: var(--cyan); }
.strap { font-family: var(--f-disp); font-size: 24px; color: var(--cyan); margin: 8px 0 20px; }
.clubs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.clubpick { text-align: left; background: var(--panel); border: 1px solid var(--line); padding: 0; display: grid; grid-template-columns: 10px 1fr; }
.clubpick:hover { border-color: var(--yel); }
.clubpick.on { border-color: var(--yel); background: #232a10; }
.clubpick .strip { height: 100%; }
.clubpick .in { padding: 7px 9px; }
.clubpick b { display: block; font-size: 15px; }
.clubpick small { color: var(--dim); font-size: 12px; display: block; }
.stars { color: var(--yel); letter-spacing: 1px; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.top { box-shadow: inset 0 -1px 0 rgba(255,255,255,.08); }
.nav button.on { color: var(--yel); }

.p2d { display: block; width: 100%; max-width: 100%; border: 2px solid var(--line); background: #165a2e; }

.mom { display: block; width: 100%; height: 34px; background: #050818; border: 1px solid var(--line); border-top: 0; }
.mdcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 360px); gap: 12px; margin-top: 12px; }
@media (max-width: 720px) { .mdcard { grid-template-columns: minmax(0, 1fr); } }
.mdinfo { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 10px; align-content: start; }
.lusvg { width: 100%; height: auto; display: block; border: 1px solid var(--line); }
.vidi div { padding: 4px 9px; border-bottom: 1px solid #1b2660; font-family: var(--f-mono); font-size: 12.5px; }
.log .var { color: var(--amb); font-weight: 600; } .log .skill { color: var(--cyan); } .log .shout { color: var(--grn); font-style: italic; }
.shouts, .rps { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.xgsvg { width: 100%; max-width: 760px; height: auto; color: var(--dim); display: block; }
.heatcv { width: 100%; max-width: 480px; height: auto; display: block; border: 1px solid var(--line); }
.p2d { cursor: default; }
.dchip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 1px 7px; border: 1px solid var(--dc); color: var(--dc); line-height: 16px; white-space: nowrap; }

.tavb { background: none; border: 0; padding: 0; color: inherit; }
.tavb .avsvg { flex: none; }
.npf { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.mpgrid { display: grid; grid-template-columns: minmax(240px, 340px) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .mpgrid { grid-template-columns: minmax(0, 1fr); } }
.mpav { display: flex; justify-content: center; }
.mpkv { font-size: 14.5px; gap: 7px 16px; }
.sw { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(255,255,255,.5); margin-right: 4px; vertical-align: -1px; }
.awgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 320px); gap: 14px; }
@media (max-width: 760px) { .awgrid { grid-template-columns: minmax(0, 1fr); } }
.tossvg { width: 100%; height: auto; display: block; border: 1px solid var(--line); }

/* clickable names */
.lnk { cursor: pointer; text-decoration: underline dotted; text-decoration-color: rgba(255,255,255,.35); text-underline-offset: 3px; }
.lnk:hover, .lnk:focus-visible { color: var(--yel); text-decoration-color: var(--yel); }
.band .lnk { text-decoration-color: currentColor; }
.modal .band > span { flex: 1; min-width: 0; }
.x.back { order: -1; font-size: 26px; padding: 0 8px 0 0; }

/* development chart */
.progsvg { width: 100%; max-width: 520px; height: auto; display: block; margin-top: 6px; }

function developPlayers() {
  for (const p of Object.values(G.players)) {
    if (p.c === 'RETIRED' || p.c === 'ABROAD') continue;
    p.age++;
    const mins = p.st.a;
    let d = 0;
    if (p.age <= 21) d = R.i(0, 4) + (mins > 15 ? 1 : 0) + (p.c === G.user && R.chance(staffAb('coach') / 40) ? 1 : 0);
    else if (p.age <= 24) d = R.i(0, 4) + (mins > 20 ? 1 : 0);
    else if (p.age <= 28) d = R.i(-1, 2);
    else if (p.age <= 31) d = R.i(-2, 1);
    else if (p.age <= 33) d = R.i(-4, 0);
    else d = R.i(-6, -1);
    if (d > 0) d = Math.min(d, Math.max(0, p.pa - p.ca));
    p.ca = clamp(p.ca + d, 35, 96);
    if (p.ca > p.pa) p.pa = p.ca;
    p.val = calcValue(p);

      } else if (divOf(p.c)) {

const REAL_CAPT = { ARS: 'Martin Odegaard', AVL: 'John McGinn', BOU: 'Adam Smith', BRE: 'Nathan Collins', BHA: 'Lewis Dunk', CHE: 'Reece James', COV: 'Matt Grimes', CRY: 'Dean Henderson', EVE: 'James Tarkowski', FUL: 'Tom Cairney', HUL: 'Lewie Coyle', IPS: "Dara O'Shea", LEE: 'Ethan Ampadu', LIV: 'Virgil van Dijk', MCI: 'Ruben Dias', MUN: 'Bruno Fernandes', NEW: 'Dan Burn', NFO: 'Ryan Yates', SUN: 'Granit Xhaka', TOT: 'Micky van de Ven' };
function lead(p) {
  if (p.pseudo) return 10;
  const a = attrs(p);
  const n = ((hash(p.n + '|Lea') % 1000) / 1000 - 0.5) * 5;
  return clamp(Math.round(a.Det * 0.45 + a.Tea * 0.25 + (p.age - 18) * 0.32 + n + (p.lb || 0)), 1, 20);
}
function bestLeaders(tid) { return squad(tid).slice().sort((a, b) => lead(b) - lead(a)); }
function ensureCaptains(tid) {
  const t = T(tid); if (!t || t.lite) return;
  const sq = squad(tid);
  if (!t.capt || !sq.some(p => p.id === t.capt)) {
    const cn = REAL_CAPT[tid] || t.captN; const real = cn && sq.find(p => p.n === cn);
    if (real) { real.lb = Math.max(real.lb || 0, 4); t.capt = real.id; }
    else t.capt = (bestLeaders(tid)[0] || {}).id;
  }
  if (!t.vice || t.vice === t.capt || !sq.some(p => p.id === t.vice)) t.vice = (bestLeaders(tid).find(p => p.id !== t.capt) || {}).id;
}
function captainProblem() {
  const t = userTeam(); const c = P(t.capt); if (!c) return null;
  const best = bestLeaders(G.user).filter(p => p.age > 19);
  const top = best[0];
  const issues = [];
  if (top && lead(top) - lead(c) >= 5) issues.push(`${surname(top.n)} is a far more natural leader than ${surname(c.n)}`);
  const r = startRatio(c); if (r != null && teamGames() - (c.mi || 0) >= 5 && r < .45) issues.push(`${surname(c.n)} rarely starts, so the armband carries little weight`);
  if (hap(c) < 35) issues.push(`${surname(c.n)} is unhappy, which spreads through the dressing room`);
  return issues.length ? issues : null;
}
function appointCaptain(kind, pid) {
  const t = userTeam(); const old = kind === 'capt' ? t.capt : t.vice; if (old === pid) return null;
  const p = P(pid); const out = [];
  if (kind === 'capt') {
    if (old && P(old) && P(old).c === G.user) { setHap(P(old), -12); out.push(`${P(old).n} is disappointed to lose the armband.`); }
    if (t.vice === pid) t.vice = old;
    t.capt = pid; setHap(p, 8);
    const top = bestLeaders(G.user).filter(q => q.age > 19)[0];
    if (top && top.id !== pid && lead(top) - lead(p) >= 5) { for (const q of squad(G.user)) q.mor = clamp(q.mor - 4, 5, 100); setHap(top, -6); out.push(`Several senior players question the decision. They see ${top.n} as the natural leader.`); }
    else { for (const q of squad(G.user)) q.mor = clamp(q.mor + 2, 5, 100); out.push(`The squad approves of ${p.n} as captain.`); }

    t.vice = pid; setHap(p, 4); out.push(`${p.n} is the new vice-captain.`);

function toast(m) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = m; el.hidden = false; clearTimeout(UI.toastT); UI.toastT = setTimeout(() => { el.hidden = true; }, 3400); }

const SPEEDS = [['Slow', 1100], ['Normal', 520], ['Fast', 170], ['Turbo', 45]];
function startLive(fid, instant) {

  render(); schedule();
}
function schedule() { const LM = UI.match; if (!LM || !LM.run) return; clearTimeout(LM.timer); LM.timer = setTimeout(tick, SPEEDS[LM.speed][1]); }
function tick() {
  const LM = UI.match; if (!LM || !LM.run) return;
  const M = LM.M;
  stepMinute(M);
  if (LM.vis) visNewMinute(LM, SPEEDS[LM.speed][1]);
  if (M.alert) { LM.alertTxt = M.alert; M.alert = null; LM.run = false; LM.panel = 'subs'; }
  if (M.ht) { M.ht = false; LM.run = false; LM.panel = 'talk'; LM.talked = false; }
  if (M.done) LM.run = false;
  renderMatch();
  schedule();
}
function uSide(M) { return M.sides[0].tid === G.user ? 0 : 1; }
function renderMatch() {
  const LM = UI.match, M = LM.M; const [A, B] = M.sides; const ui = uSide(M);

  const clock = M.done ? 'FT' : M.min === 0 ? 'KO' : (M.min > 90 && !M.et ? '90' : M.min) + "'";
  const S = M.sides[ui];
  const st = M.sides.map(s => ({ po: Math.round(100 * s.st.po / Math.max(1, A.st.po + B.st.po)), sh: s.st.sh, ot: s.st.ot, co: s.st.co, fo: s.st.fo, yc: s.st.yc, rc: s.st.rc, xg: +s.st.xg.toFixed(2) }));
  const lineup = (s) => `<div class="tw"><table class="t"><thead><tr><th>${esc(s.name)}</th><th class="n">Rtg</th><th class="n">Cnd</th></tr></thead><tbody>${s.ps.map(e => `<tr style="${e.on ? '' : 'opacity:.45'}"><td><span class="mono dim">${ROLE_LABEL[e.role]}</span> ${esc(e.p.pseudo ? cap1(ROLE_NOUN[e.role]) : surname(e.p.n))}${e.g ? ' ⚽'.repeat(e.g) : ''}${e.yc ? ' <span class="yel">▮</span>' : ''}${e.rc ? ' <span class="red">▮</span>' : ''}${e.inj ? ' <span class="red">✚</span>' : ''}${e.subOn ? ' <span class="grn">↑' + e.subOn + "'</span>" : ''}</td><td class="n ${rClass(e.rt)}">${e.rt.toFixed(1)}</td><td class="n ${condCls(e.p.cond)}">${Math.round(e.p.cond)}</td></tr>`).join('')}</tbody></table></div>`;
  let panel = '';

      <h2 class="sect">Team instructions</h2><div style="display:grid;gap:8px">${tacControls(S.tac, 'mtac')}</div></div>`;
  }
  app().innerHTML = `<div class="start" style="max-width:1180px;padding-top:12px">

      ${LM.vis ? `<div class="seg"><button class="${LM.view === '2d' ? 'on' : ''}" data-a="mview" data-v="2d">2D pitch</button><button class="${LM.view !== '2d' ? 'on' : ''}" data-a="mview" data-v="text">Text only</button></div>` : ''}

      <div><div class="box pad">${statBars(st)}</div><div class="grid2" style="margin-top:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${lineup(A)}${lineup(B)}</div></div>

function pnById(M, id) { for (const S of M.sides) for (const e of S.ps) if (e.p.id === id) return e.p.pseudo ? cap1(ROLE_NOUN[e.role]) : e.p.n; return ''; }
function teamTalk(k) {
  const LM = UI.match, M = LM.M, ui = uSide(M), S = M.sides[ui];
  const diff = M.score[ui] + M.agg[ui] - M.score[1 - ui] - M.agg[1 - ui];
  let d, txt;
  if (k === 'praise') { d = diff >= 0 ? 6 : -3; txt = diff >= 0 ? 'The players respond well to the praise.' : 'Some players look puzzled to be praised while behind.'; }

// ===== SQUAD DYNAMICS: happiness, player talks, media =====
const RIVALS = [['ARS', 'TOT'], ['ARS', 'CHE'], ['LIV', 'EVE'], ['LIV', 'MUN'], ['MCI', 'MUN'], ['NEW', 'SUN'], ['CRY', 'BHA'], ['CHE', 'TOT'], ['CHE', 'FUL'], ['BRE', 'FUL'], ['LEE', 'MUN'], ['NFO', 'LEE'], ['COV', 'AVL'], ['IPS', 'NOR'], ['ARS', 'MUN'], ['LIV', 'MCI']];
function isRival(a, b) { return RIVALS.some(([x, y]) => (x === a && y === b) || (x === b && y === a)); }
function hap(p) { return p.hap == null ? 65 : p.hap; }
function setHap(p, d) { p.hap = clamp(hap(p) + d, 0, 100); }
const STATUS_LABEL = { key: 'Key player', first: 'First team', rotation: 'Rotation', backup: 'Squad player', youth: 'Prospect' };
const STATUS_EXP = { key: .8, first: .6, rotation: .35, backup: .15, youth: .05 };
function squadStatus(p) { if (p.age <= 19 && p.ca < 78) return 'youth'; return importance(p); }
function teamGames() { return Object.values(G.fx).filter(f => f.r && (f.h === G.user || f.a === G.user)).length; }
function startRatio(p) { const n = teamGames() - (p.mi || 0); return n > 0 ? p.st.s / n : null; }
function hapLabel(h) { return h >= 80 ? 'Delighted' : h >= 65 ? 'Content' : h >= 50 ? 'Settled' : h >= 35 ? 'Frustrated' : h >= 20 ? 'Unhappy' : 'Wants out'; }
function hapCls(h) { return h >= 65 ? 'grn' : h >= 50 ? '' : h >= 35 ? 'amb' : 'red'; }
function moraleLabel(m) { return m >= 85 ? 'Superb' : m >= 70 ? 'Good' : m >= 55 ? 'Okay' : m >= 40 ? 'Low' : 'Very low'; }
function teamSpirit() { const sq = squad(G.user); if (!sq.length) return 50; return sq.reduce((s, p) => s + p.mor * .6 + hap(p) * .4, 0) / sq.length; }
function concerns(p) {
  const out = []; const st = squadStatus(p); const r = startRatio(p); const n = teamGames();
  if (r != null && n - (p.mi || 0) >= 4 && r + .15 < STATUS_EXP[st] && p.inj <= 0) out.push('wants more first-team football');
  if (p.con <= G.year + 1 && p.ca >= 72 && p.age < 32) out.push('is worried about his contract');
  if (p.prom) out.push(`was promised ${p.prom.need} starts in ${p.prom.of} games`);
  if (p.req) out.push('has asked to leave');
  if (p.form.length >= 3 && +formAvg(p) < 6.3) out.push('is short of confidence');
  return out;
}

// weekly update, called from weekly()
function weeklyDynamics() {
  const n = teamGames();
  const tb = userTable(); const pos = tb.findIndex(r => r.t === G.user) + 1; const tgt = boardTarget().pos;
  for (const p of squad(G.user)) {
    if (p.hap == null) p.hap = 65;
    let d = (65 - p.hap) * 0.04; // drift
    const st = squadStatus(p); const r = startRatio(p);
    if (n - (p.mi || 0) >= 4 && r != null && p.inj <= 0) { const gap = r - STATUS_EXP[st]; d += clamp(gap * 9, -3, 2); }
    d += (p.mor - 65) / 30;
    if (n >= 6) d += pos <= tgt ? .6 : pos > tgt + 4 ? -.8 : 0;
    if (p.con <= G.year + 1 && p.ca >= 74 && p.age < 31 && G.date >= sd('2026-11-01')) d -= 1;
    // promises
    if (p.prom && n - p.prom.mb >= p.prom.of) {
      const got = p.st.s - p.prom.sb;
      if (got >= p.prom.need) { d += 12; msg('Promise kept', `${p.n} is pleased you kept your word and gave him ${got} starts.`); }
      else { d -= 25; p.trust = (p.trust || 0) - 1; msg('Promise broken', `${p.n} feels let down. You promised ${p.prom.need} starts in ${p.prom.of} games and he got ${got}.`); }
      p.prom = null;
    }
    setHap(p, d);
    p.mor = Math.min(p.mor, hap(p) + 35);
    // transfer requests
    if (hap(p) < 22) { p.low = (p.low || 0) + 1; } else p.low = 0;
    if (!p.req && p.low >= 3 && p.age > 19) { const why = concerns(p)[0]; p.req = true; msg('Transfer request', `${p.n} has handed in a transfer request. He says he ${why || 'is unhappy at the club'}. Talk to him from his profile or the Dynamics screen.`); if (R.chance(.6)) mediaStory(`Reports say ${p.n} has asked to leave ${userTeam().short} after falling out of favour.`, -3); }
    if (p.req && hap(p) >= 55) { p.req = false; msg('Transfer request withdrawn', `${p.n} has withdrawn his transfer request and is committed to the club again.`); }
  }
  // captaincy
  const cp = captainProblem(); if (cp) { for (const p of squad(G.user)) p.mor = clamp(p.mor - .8, 5, 100); if (R.chance(.15)) msg('Dressing room', 'Senior players are unsettled about the captaincy: ' + cp[0] + '.'); }
  // occasional media stories
  if (R.chance(.18)) randomStory();
}
function mediaStory(text, fanD) { G.fans = clamp((G.fans == null ? 60 : G.fans) + (fanD || 0), 0, 100); news('Media', text, G.user); }
function randomStory() {
  const sq = squad(G.user);
  const opts = [];
  const unhappy = sq.filter(p => hap(p) < 35); if (unhappy.length) { const p = R.pick(unhappy); opts.push(() => mediaStory(`Sources close to ${p.n} say he is frustrated with his situation at ${userTeam().short}.`, -1)); }
  const star = sq.filter(p => p.ca >= 82 && +formAvg(p) >= 7.2); if (star.length) { const p = R.pick(star); opts.push(() => mediaStory(`${p.n} is attracting attention from abroad after a strong run of form.`, 0)); }
  const tb = userTable(); const pos = tb.findIndex(r => r.t === G.user) + 1;
  if (teamGames() >= 5) { if (pos <= boardTarget().pos) opts.push(() => mediaStory(`Pundits praise ${G.mgr}'s work at ${userTeam().short}, who sit ${ordinal(pos)}.`, 3)); else opts.push(() => mediaStory(`Questions are being asked about ${G.mgr}'s future with ${userTeam().short} ${ordinal(pos)} in the table.`, -2)); }
  if (opts.length) R.pick(opts)();
}

// ---- talking to players ----
function canTalk(p) { return !p.lastTalk || dDiff(p.lastTalk, G.date) >= 7; }
function talkTo(pid, k) {
  const p = P(pid); if (!p || p.c !== G.user) return null;
  if (!canTalk(p)) return { reply: `${surname(p.n)} says you spoke only a few days ago.`, cls: 'dim' };
  p.lastTalk = G.date;
  const fa = p.form.length ? +formAvg(p) : null; const det = attrs(p).Det; const st = squadStatus(p); const r = startRatio(p);
  let reply, dh = 0, dm = 0;
  if (k === 'praise') {
    if (fa == null) { reply = "Thanks boss, but I haven't really played yet."; dh = 1; }
    else if (fa >= 7.0) { reply = "Thanks boss. I'm enjoying my football right now."; dh = 7; dm = 8; }
    else if (fa >= 6.6) { reply = 'Cheers, I know there is more to come from me.'; dh = 3; dm = 4; }
    else { reply = "With respect, I know I haven't played well. Don't patronise me."; dh = -4; dm = -3; }
  } else if (k === 'criticise') {
    if (fa != null && fa >= 7) { reply = "I don't understand that. I've been one of our best players."; dh = -10; dm = -8; }
    else if (det >= 13) { reply = "Fair enough. I'll show you in training."; dm = 7; dh = -1; }
    else { reply = "I'm trying my best. That doesn't help me."; dm = -7; dh = -5; }
  } else if (k === 'time') {
    const exp = STATUS_EXP[st];
    if (r == null || teamGames() < 3) reply = "It's early. I'm happy to fight for my place.";
    else if (r + .15 < exp) reply = `I see myself as a ${STATUS_LABEL[st].toLowerCase()}, but I've only started ${p.st.s} of the ${teamGames() - (p.mi || 0)} games I was fit for. I need to play more.`;
    else reply = "I'm happy with my game time. Thanks for asking.";
    dh = 1;
    return { reply, cls: '', promise: r != null && r + .15 < exp && !p.prom };
  } else if (k === 'promise') {
    if (p.prom) return { reply: 'You already gave me your word.', cls: 'dim' };
    if ((p.trust || 0) < -1) { reply = "You've broken promises before. I'll believe it when I see it."; dh = 2; }
    else { reply = "That's all I want. I'll hold you to it."; dh = 10; dm = 5; }
    p.prom = { need: 3, of: 5, sb: p.st.s, mb: teamGames(), d: G.date };
  } else if (k === 'fight') {
    if (st === 'youth' || st === 'backup') { reply = "Understood. I'll keep working hard."; dh = 2; dm = 2; }
    else { reply = "I've earned more than that. I'm disappointed."; dh = -6; dm = -4; }
  } else if (k === 'encourage') {
    if (p.age <= 22) { reply = "Thanks boss, that means a lot. I want to learn."; dh = 6; dm = 6; }
    else { reply = "Appreciate it. I'll keep going."; dh = 3; dm = 3; }
  } else if (k === 'letgo') {
    p.listed = true; p.req = false; reply = "Thank you for being honest. I'll stay professional until a deal is done."; dh = 15;
  } else if (k === 'stay') {
    if ((p.trust || 0) < 0 || hap(p) < 15) { reply = "My mind is made up. I want to leave."; dh = -3; }
    else { reply = "If I am part of your plans, I'll give it another go."; dh = 14; p.req = false; }
  } else if (k === 'contract') {
    if (p.con <= G.year + 1) reply = `My deal ends in summer ${p.con}. I want to know if you see me here next season.`;
    else reply = `I'm under contract until ${p.con}. I'm not thinking about that now.`;
    return { reply, cls: '' };
  }
  setHap(p, dh); p.mor = clamp(p.mor + dm, 5, 100);
  return { reply, cls: dh > 0 ? 'grn' : dh < 0 ? 'red' : '' };
}

function pressFor(f) {

  const tb = userTable(); const myPos = tb.findIndex(r => r.t === G.user) + 1; const oPos = tb.findIndex(r => r.t === opp) + 1;
  const myForm = (tb.find(r => r.t === G.user) || { form: [] }).form.slice(-4);

  if (isRival(G.user, opp)) return { q: `It's a derby against ${on}. What does this game mean to you and the fans?` };

// ---- post-match interview ----
function interviewFor(M) {
  const ui = uSide(M), S = M.sides[ui]; const gf = M.score[ui], ga = M.score[1 - ui];
  const won = gf > ga || (M.pens && M.pens[ui] > M.pens[1 - ui]); const lost = !won && (gf < ga || M.pens);
  const star = S.ps.filter(e => !e.p.pseudo && e.mins > 0).sort((a, b) => b.rt - a.rt)[0];
  const worst = S.ps.filter(e => !e.p.pseudo && e.mins >= 45).sort((a, b) => a.rt - b.rt)[0];
  const red = M.ev.find(e => e.t === 'rc' && e.side === ui);
  let q;
  if (red) q = `You had a man sent off. Was it the right decision from the referee?`;
  else if (won && gf - ga >= 3) q = `A big win. Was this your best performance of the season?`;
  else if (won) q = `Three points. What pleased you most today?`;
  else if (lost && ga - gf >= 3) q = `That was a heavy defeat. What went wrong?`;
  else if (lost) q = `A disappointing result. How do you explain it?`;
  else q = `A point today. Is that a fair result?`;
  return { q, won, lost, star, worst, red };
}
function interviewAnswer(k) {

  else if (k === 'star' && I.star) { const p = I.star.p; setHap(p, 6); p.mor = clamp(p.mor + 6, 5, 100); txt = `${p.n} is delighted to be singled out.`; }
  else if (k === 'blame' && I.worst) { const p = I.worst.p; const det = attrs(p).Det; if (det >= 14) { p.mor = clamp(p.mor + 4, 5, 100); txt = `${p.n} takes the criticism on the chin and wants to respond.`; } else { p.mor = clamp(p.mor - 10, 5, 100); setHap(p, -8); txt = `${p.n} is upset at being criticised in public.`; } }
  else if (k === 'demand') { for (const p of ids) { const det = attrs(p).Det; p.mor = clamp(p.mor + (det >= 13 ? 3 : -3), 5, 100); } txt = 'Some players respond to the challenge, others feel it was harsh.'; }
  else if (k === 'ref') { G.fans = clamp((G.fans ?? 60) + 3, 0, 100); if (R.chance(.45)) { const fine = 0.05; userTeam().bal -= fine; userTeam().fin.out.other += fine; G.board = clamp(G.board - 2, 0, 100); msg('FA charge', `The FA has fined ${G.mgr} ${money(fine)} for comments about the referee.`); txt = 'The fans loved it. The FA did not.'; } else txt = 'The fans loved it. The FA has let it go this time.'; }

}

// ===== TEAM RATING & DIFFICULTY =====
// Rating = average overall of the best XI (one goalkeeper + ten outfield players).
function bestXIRating(players) {
  const gk = players.filter(p => p.pos === 'GK').sort((a, b) => b.ca - a.ca)[0];
  const out = players.filter(p => p.pos !== 'GK').sort((a, b) => b.ca - a.ca).slice(0, 10);
  const xi = (gk ? [gk] : []).concat(out);
  return xi.length ? Math.round(xi.reduce((s, p) => s + p.ca, 0) / xi.length * 10) / 10 : 0;
}
const DIFF = [
  { k: 'Easy', c: 'var(--grn)', d: 'A title-winning squad. The pressure is to win everything.' },
  { k: 'Normal', c: 'var(--cyan)', d: 'Strong enough for the top four, with room to improve.' },
  { k: 'Hard', c: 'var(--yel)', d: 'A mid-table squad. Europe would be a big achievement.' },
  { k: 'Very hard', c: 'var(--amb)', d: 'Thin quality. A relegation scrap is likely without smart signings.' },
  { k: 'Extreme', c: 'var(--red)', d: 'The weakest squad in the league. Survival would be a miracle.' }
];
const DIFF_CH = [
  { k: 'Easy', c: 'var(--grn)', d: 'Promotion favourites. Anything less than the top two will disappoint.' },
  { k: 'Normal', c: 'var(--cyan)', d: 'A play-off squad with a real chance of going up.' },
  { k: 'Hard', c: 'var(--yel)', d: 'A mid-table Championship squad. The play-offs would be a fine season.' },
  { k: 'Very hard', c: 'var(--amb)', d: 'Short on quality. Expect a fight to stay clear of the bottom three.' },
  { k: 'Extreme', c: 'var(--red)', d: 'One of the weakest squads in the division. Survival would be a big achievement.' }
];
const DIFF_BANDS = { PL: ['top 3', '4th–7th', '8th–13th', '14th–17th', 'bottom 3'], CH: ['top 3', '4th–8th', '9th–15th', '16th–20th', 'bottom 4'] };
function diffFromRank(rank, div) { return div === 'CH' ? DIFF_CH[rank <= 3 ? 0 : rank <= 8 ? 1 : rank <= 15 ? 2 : rank <= 20 ? 3 : 4] : DIFF[rank <= 3 ? 0 : rank <= 7 ? 1 : rank <= 13 ? 2 : rank <= 17 ? 3 : 4]; }
// before a game exists: read ratings from the squad data
function startRatings(div) {
  const list = (div === 'CH' ? CH_CLUBS : PL_CLUBS).map(c => {
    const ps = c.sq.trim().split('\n').map(l => { const [, , pos, , , ca] = l.split('|'); return { pos, ca: +ca + (div === 'CH' ? 0 : ({ COV: 3, HUL: 3, IPS: 2, LEE: 1 }[c.id] || 0)) }; });
    return { id: c.id, r: bestXIRating(ps) };
  }).sort((a, b) => b.r - a.r);
  const out = {}; list.forEach((x, i) => out[x.id] = { r: x.r, rank: i + 1, n: list.length, diff: diffFromRank(i + 1, div) });
  return out;
}
// during a career: live squads
function leagueRatings(div) {
  div = div || userDiv();
  const list = divTeams(div).map(id => ({ id, r: bestXIRating(squad(id)) })).sort((a, b) => b.r - a.r);
  const out = {}; list.forEach((x, i) => out[x.id] = { r: x.r, rank: i + 1, n: list.length, diff: diffFromRank(i + 1, div) });
  return out;
}

const GROW = [[18, 3.5], [19, 3.2], [20, 3.0], [21, 2.6], [22, 2.2], [23, 1.6], [24, 1.1], [25, .6], [26, .3], [27, .1], [28, 0], [29, -.3], [30, -.6], [31, -1], [32, -1.5], [33, -2.2]];

  // minutes and ratings from last month's fixtures
  const apps = {}, rsum = {}, games = {};

    if (!f.r || f.d < from || f.d >= now) continue;
    for (const tid of [f.h, f.a]) games[tid] = (games[tid] || 0) + 1;
    if (f.rt) for (const side of f.rt) if (side) for (const [id, r, , , on] of side) { apps[id] = (apps[id] || 0) + (on ? .5 : 1); rsum[id] = (rsum[id] || 0) + r; }
  }

  const ups = [], downs = [];
  for (const p of Object.values(G.players)) {
    if (!p || ['RETIRED', 'ABROAD', 'FA'].includes(p.c) || String(p.c).startsWith('REL_')) continue;
    const t = T(p.c); if (!t) continue;
    if (p.cax == null) p.cax = p.ca;

    if (p.ca !== before) p.val = calcValue(p);

    if (!t.lite || p.loan) {

      if (p.ca >= base + 2 || (p.ca > before && Math.floor(p.ca / 5) > Math.floor(before / 5) && p.age <= 24)) { ups.push(p); p.lastNews = p.ca; }

  }
  if (ups.length) news('Player development', ups.length === 1 ? `${ups[0].n} has improved to ${ups[0].ca}.` : `Improving: ${ups.slice(0, 6).map(p => `${p.n} (now ${p.ca})`).join(', ')}${ups.length > 6 ? ` and ${ups.length - 6} more` : ''}.`, G.user);
  if (downs.length) news('Player development', `Coaching staff report a drop in sharpness: ${downs.slice(0, 5).map(p => `${p.n} (now ${p.ca})`).join(', ')}.`, G.user);
}
function addMonths(k, n) { let y = +k.slice(0, 4), m = +k.slice(5, 7) + n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + String(m).padStart(2, '0'); }
const _dtC = dailyTick;
dailyTick = function () {
  if (G.date.endsWith('-01')) { try { monthlyProgress(); } catch (e) { console.error(e); } }
  return _dtC();
};
// smaller summer step now that most change happens during the season
developPlayers = function () {
  for (const p of Object.values(G.players)) {
    if (p.c === 'RETIRED' || p.c === 'ABROAD') continue;
    p.age++;
    let d;
    if (p.age <= 21) d = R.i(0, 2) + (p.c === G.user && R.chance(staffAb('coach') / 40) ? 1 : 0);
    else if (p.age <= 24) d = R.i(0, 1);
    else if (p.age <= 28) d = R.i(0, 2) - 1;
    else if (p.age <= 31) d = R.i(-1, 0);
    else if (p.age <= 33) d = R.i(-2, 0);
    else d = R.i(-3, -1);
    if (d > 0) d = Math.min(d, Math.max(0, p.pa - p.ca));
    p.ca = clamp(p.ca + d, 35, 96); p.cax = p.ca;
    if (p.ca > p.pa) p.pa = p.ca;
    p.val = calcValue(p);
    if (p.age >= 34 && (p.age >= 38 || R.chance((p.age - 33) * .18) || p.ca < 60)) {
      if (G.sq[p.c]) G.sq[p.c] = G.sq[p.c].filter(x => x !== p.id);
      if (p.c === G.user) news('Retirement', `${p.n} has announced his retirement from professional football.`, G.user);
      p.c = 'RETIRED'; G.fa = G.fa.filter(x => x !== p.id); continue;
    }
    if (p.con <= G.year + 1 && G.sq[p.c]) {
      if (p.c === G.user) {
        G.sq[p.c] = G.sq[p.c].filter(x => x !== p.id); news('Contract', `${p.n}'s contract has expired and he has left the club.`, G.user); p.c = 'FA'; G.fa.push(p.id);
      } else if (divOf(p.c)) {
        if (p.age <= 33 && p.ca >= T(p.c).rep - 16 && R.chance(.9)) { p.con = G.year + 1 + R.i(1, 3); p.wage = wageFor(p, p.c); }
        else { G.sq[p.c] = G.sq[p.c].filter(x => x !== p.id); p.c = 'FA'; G.fa.push(p.id); }
      }
    }
  }
  G.fa = G.fa.filter(id => P(id) && P(id).c === 'FA').sort((a, b) => P(b).ca - P(a).ca).slice(0, 120);
};

// ---------- rating history chart in the player pop-up ----------
function progressSvg(p) {
  const h = p.ch; if (!h || !h.v || h.v.length < 1) return '';
  const vals = h.v.slice();
  const est = typeof potEstimate === 'function' ? potEstimate(p) : p.pa;
  const spread = Math.max(1.5, (21 - (typeof staffAb === 'function' ? staffAb('scout') : 10)) / 3);
  const lo = Math.min(...vals, est - spread) - 2, hi = Math.max(...vals, est + spread) + 2;
  const W = 300, H = 110, pl = 26, pr = 8, pt = 8, pb = 18;
  const x = i => pl + (vals.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (vals.length - 1));
  const y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const ticks = []; for (let v = Math.ceil(lo / 5) * 5; v <= hi; v += 5) ticks.push(v);
  const labels = []; for (let i = 0; i < vals.length; i++) { const k = addMonths(h.k, i); if (i === 0 || k.endsWith('-01') || i === vals.length - 1) labels.push([i, MON[+k.slice(5) - 1] + (k.endsWith('-01') || i === 0 ? ' ' + k.slice(2, 4) : '')]); }
  return `<svg class="progsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rating by month for ${esc(p.n)}: from ${vals[0]} to ${vals[vals.length - 1]}; scout's potential estimate about ${Math.round(est)}">
    <rect x="${pl}" y="${y(est + spread).toFixed(1)}" width="${W - pl - pr}" height="${(y(est - spread) - y(est + spread)).toFixed(1)}" class="pband"/>
    <text x="${W - pr - 2}" y="${(y(est + spread) - 2).toFixed(1)}" text-anchor="end" class="plab">potential (scout)</text>
    ${ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="pgrid"/><text x="${pl - 4}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" class="plab">${v}</text>`).join('')}
    <path d="${line}" class="pline"/>
    ${vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2" class="pdot"><title>${addMonths(h.k, i)}: ${v}</title></circle>`).join('')}
    ${labels.map(([i, l]) => `<text x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" class="plab">${l}</text>`).join('')}
  </svg>`;
}
const _pxC = playerExtra;
playerExtra = function (p) {
  const base = _pxC(p);
  const ch = p.ch && p.ch.v && p.ch.v.length ? p.ch.v : null;
  const first = ch ? ch[0] : null, last = ch ? ch[ch.length - 1] : null;
  const box = `<h2 class="sect">Development</h2><div class="box pad"><div class="row" style="justify-content:space-between;gap:10px;align-items:baseline"><span class="dim" style="font-size:13px">Overall rating by month${ch && ch.length > 1 ? ` · ${last - first >= 0 ? '+' : ''}${last - first} since ${MON[+p.ch.k.slice(5) - 1]} ${p.ch.k.slice(0, 4)}` : ''}</span><span class="mono" style="font-size:13px">Potential (scout) ${potStars(p)}</span></div>${ch ? progressSvg(p) : '<p class="dim" style="margin:6px 0 0">Monthly ratings are recorded from the start of each month during the season.</p>'}</div>`;
  return base + box;
};

// ---------- play-offs panel under the Championship table ----------
function poHtml() {
  const po = G.cups && G.cups.PO; if (!po) return '';
  const rs = po.rounds.filter(r => r.ties.length);
  if (!rs.length) return `<p class="dim">The play-off draw follows the final round on ${dNice(sd(CAL.ch[CAL.ch.length - 1]), false)}. Eliminators ${dNice(po.rounds[0].d[0], false)}, semi-finals ${po.rounds[1].d.map(d => dShort(d)).join(' & ')}, final at Wembley ${dNice(po.rounds[2].d[0], false)}.</p>`;
  return `<h2 class="sect">Play-offs${po.winner ? ' · promoted: ' + tLink(po.winner, true) : ''}</h2>` + rs.slice().reverse().map(r => `<div class="dim mono" style="margin:6px 0 4px">${esc(r.n)} · ${r.d.map(d => dShort(d)).join(' & ')}${r.neutral ? ' · Wembley' : ''}</div><div class="tw">${tiesTable(r)}</div>`).join('');
}

// Championship derbies (used by press conferences and the matchday atmosphere)
RIVALS.push(['WHU', 'MIL'], ['SOU', 'POR'], ['BIR', 'WBA'], ['WOL', 'WBA'], ['BIR', 'WOL'], ['CAR', 'SWA'], ['BRC', 'CAR'], ['BLB', 'BUR'], ['BLB', 'PNE'], ['BUR', 'PNE'], ['NOR', 'IPS'], ['DER', 'NFO'], ['CHA', 'MIL'], ['MID', 'SUN'], ['SHU', 'LEE'], ['STK', 'WOL'], ['BOL', 'BLB'], ['WRE', 'CAR'], ['LIN', 'HUL'], ['QPR', 'CHE'], ['WAT', 'BRE']);

// boot (kept last)
if (window.claude && window.claude.hot) { try { window.claude.hot.snapshot(() => ({ G, scr: UI.match ? 'inbox' : UI.scr })); } catch (e) { } }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
